<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Experiment 6 - iframe example">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 6 - iframe</title>
</head>

<body bgcolor="#f5f5f5" text="black">

<h1 align="center" title="Heading">
  Experiment 6: Frames using iframe
</h1>

<hr>

<!-- Top Frame -->
<iframe 
  srcdoc="<h2 align='center'>Top Frame</h2><p align='center'>This is top section</p>"
  width="100%" 
  height="150"
  title="Top Frame"
  name="topFrame"
  scrolling="no"
  frameborder="1">
</iframe>

<br><br>

<!-- Left and Right Frames -->
<table width="100%" border="1">

<tr>

<td width="50%" align="center">
  <iframe 
    srcdoc="<h3>Left Frame</h3><p>Left content here</p>"
    width="100%" 
    height="200"
    title="Left Frame"
    name="leftFrame"
    loading="lazy">
  </iframe>
</td>

<td width="50%" align="center">
  <iframe 
    srcdoc="<h3>Right Frame</h3><p>Right content here</p>"
    width="100%" 
    height="200"
    title="Right Frame"
    name="rightFrame"
    loading="lazy">
  </iframe>
</td>

</tr>

</table>

<hr>

<!-- Click link to load inside iframe -->
<p align="center">
  <a href="https://www.google.com" target="rightFrame" title="Open in Right Frame">
    Open Google in Right Frame
  </a>
</p>

<hr>

<footer align="center">
  
</footer>

</body>
</html>
