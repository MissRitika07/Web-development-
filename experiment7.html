<body bgcolor="#f3e5f5" text="black" link="blue" alink="red" vlink="purple">

<header id="top" title="Header Section">
  <h1 align="center" title="Experiment Title">
    Experiment 7: Link Tags in HTML
  </h1>

  <p align="center">
    <strong>Name:</strong> Ritika Molawade <br>
    <strong>Roll No:</strong> 16
  </p>
</header>

<hr>

<section id="content" title="Main Content">

  <p title="Description">
    This page demonstrates different types of links using the <code>&lt;a&gt;</code> tag.
  </p>

  <!-- External Link -->
  <p>
    <a href="https://www.example.com"
       target="_blank"
       title="Open Example Website"
       rel="noopener"
       id="extLink">
       External Link (Example.com)
    </a>
  </p>

  <!-- Internal Link -->
  <p>
    <a href="#section2"
       title="Go to Section 2"
       id="internalLink">
       Internal Link (Go to Section 2)
    </a>
  </p>

  <!-- Email Link -->
  <p>
    <a href="mailto:ritika@example.com"
       title="Send Email"
       id="emailLink">
       Send Email
    </a>
  </p>

  <!-- Download Link -->
  <p>
    <a href="sample.pdf"
       download
       title="Download File"
       id="downloadLink">
       Download File
    </a>
  </p>

  <!-- Image as Link -->
  <p>
    <a href="https://www.google.com"
       target="_blank"
       title="Go to Google">
       
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg"
           alt="Google Logo"
           width="150"
           height="60"
           border="2">
    </a>
  </p>

</section>

<hr>

<!-- Target Section -->
<section id="section2" title="Section 2">
  <h2>Section 2</h2>

  <!-- Back to Top -->
  <p>
    <a href="#top" title="Go to Top">
      Back to Top
    </a>
  </p>
</section>
